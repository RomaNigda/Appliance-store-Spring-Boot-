# PostgreSQL Datasource Settings
spring.datasource.url=jdbc:postgresql://localhost:5432/appliance-store
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging Settings
logging.level.com.epam.rd.autocode.assessment.appliances.service.impl=DEBUG
logging.level.com.epam.rd.autocode.assessment.appliances.controller=DEBUG

# Server Settings
server.port=8080

# SQL Initialization Settings
spring.jpa.defer-datasource-initialization=true
#spring.sql.init.data-locations=classpath:data.sql

# JWT Configuration
jwt.secret=${JWT_SECRET:mE57irnPY6qoa9NRVEKqQUG5LQUU7v1zFcyb8o9OxDg=}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}