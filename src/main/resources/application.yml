spring:

  datasource:
    url: jdbc:h2:mem:store
    driver-class-name: org.h2.Driver
    username: sa
    password: password

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true

  h2:
    console:
      enabled: true

  server:
    port: 8080

  messages:
    basename: messages/messages
    encoding: UTF-8
    fallback-to-system-locale: false

  web:
    locale: en
    locale-resolver: accept-header

jwt:
  secret: mE57irnPY6qoa9NRVEKqQUG5LQUU7v1zFcyb8o9OxDg=
  expiration: 86400000
  refresh-expiration: 604800000