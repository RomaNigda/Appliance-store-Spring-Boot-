spring:
  application:
    name: appliance-store

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    defer-datasource-initialization: false
    properties:
      jakarta:
        persistence:
          validation:
            mode: auto

  sql:
    init:
      mode: never

  messages:
    basename: messages/messages
    encoding: UTF-8
    fallback-to-system-locale: false

  web:
    locale: en
    locale-resolver: accept-header
    resources:
      add-mappings: false

server:
  port: 8080

logging:
  level:
    root: INFO
    com.epam.rd.autocode.assessment.appliances:
      service.impl: INFO
      controller: INFO
      aspect: INFO

jwt:
  secret: ${JWT_SECRET:mE57irnPY6qoa9NRVEKqQUG5LQUU7v1zFcyb8o9OxDg=}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}