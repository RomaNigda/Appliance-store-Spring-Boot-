# ============ APPLICATION ============
spring:
  application:
    name: appliance-store

  profiles:
    active: dev

  # ============ MESSAGES ============
  messages:
    basename: messages/messages
    encoding: UTF-8
    fallback-to-system-locale: false

  # ============ LOCALE ============
  web:
    locale: en
    locale-resolver: accept-header

# ============ SERVER ============
server:
  port: 8080

# ============ LOGGING ============
logging:
  level:
    com.epam.rd.autocode.assessment.appliances:
      service.impl: DEBUG
      controller: DEBUG
      aspect: DEBUG

# ============ JWT ============
jwt:
  secret: ${JWT_SECRET:mE57irnPY6qoa9NRVEKqQUG5LQUU7v1zFcyb8o9OxDg=}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}