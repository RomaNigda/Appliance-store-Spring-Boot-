# PostgreSQL Datasource Settings
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/appliance-store
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  # JPA / Hibernate Settings
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
      jakarta:
        persistence:
          validation:
            mode: auto
    defer-datasource-initialization: true

  messages:
    basename: messages/messages
    encoding: UTF-8
    fallback-to-system-locale: false

  # Default locale
  web:
    locale: en
    locale-resolver: accept-header



# Server Settings
server:
  port: 8080

# Logging Settings
logging:
  level:
    com.epam.rd.autocode.assessment.appliances:
      service.impl: DEBUG
      controller: DEBUG
      aspect: DEBUG

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:mE57irnPY6qoa9NRVEKqQUG5LQUU7v1zFcyb8o9OxDg=}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}