spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/appliance-store
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
      jakarta:
        persistence:
          validation:
            mode: auto
    defer-datasource-initialization: true

  messages:
    basename: messages/messages
    encoding: UTF-8
    fallback-to-system-locale: false

  web:
    locale: en
    locale-resolver: accept-header
    resources:
      add-mappings: false


  sql:
    init:
      mode: never



server:
  port: 8080

logging:
  level:
    com.epam.rd.autocode.assessment.appliances:
      service.impl: INFO
      controller: INFO
      aspect: INFO

jwt:
  secret: ${JWT_SECRET:mE57irnPY6qoa9NRVEKqQUG5LQUU7v1zFcyb8o9OxDg=}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}