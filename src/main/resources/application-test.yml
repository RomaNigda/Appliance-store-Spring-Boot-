spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/appliance-store
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
      jakarta:
        persistence:
          validation:
            mode: auto
    defer-datasource-initialization: true

  messages:
    basename: messages/messages
    encoding: UTF-8
    fallback-to-system-locale: false

  web:
    locale: en
    locale-resolver: accept-header

  sql:
    init:
      mode: always



server:
  port: 8080

logging:
  level:
    com.epam.rd.autocode.assessment.appliances:
      service.impl: DEBUG
      controller: DEBUG
      aspect: DEBUG
