# ============ POSTGRESQL DATASOURCE ============
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/appliance-store
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  # ============ JPA / HIBERNATE ============
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
      jakarta:
        persistence:
          validation:
            mode: auto
    defer-datasource-initialization: true

  # ============ SQL INIT ============
  sql:
    init:
      mode: never