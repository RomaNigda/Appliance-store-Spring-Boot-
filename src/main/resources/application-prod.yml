spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/appliance-store
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
      jakarta:
        persistence:
          validation:
            mode: auto

  sql:
    init:
      mode: never

logging:
  level:
    root: WARN
    com.epam.rd.autocode.assessment.appliances: INFO